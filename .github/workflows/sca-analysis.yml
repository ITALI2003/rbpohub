name: SCA Analysis Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Позволяет запускать upload_to_dtrack вручную
  workflow_dispatch:

env:
  TRIVY_IMAGE: aquasec/trivy:latest

jobs:
  build-sbom:
    name: Build SBOM & Analyze Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq bash

      - name: Make scripts executable
        run: chmod +x scripts/*.sh individual_work/*/*.sh

      - name: Run dependency analyzer
        run: ./scripts/dependency_analyzer.sh individual_work

      - name: Generate STM32 SBOM
        run: |
          ./scripts/generate_embedded_sbom.sh \
            individual_work/aitova_stm32_channel/third_party.txt \
            robot-ch2-ch3-stm32 \
            "Robot TMR backup channel (STM32H7)" \
            1.0.0 \
            individual_work/aitova_stm32_channel/sbom_stm32.json

      - name: Generate Jetson SBOM
        run: |
          ./scripts/generate_embedded_sbom.sh \
            individual_work/kutuzova_jetson_ota/third_party.txt \
            robot-ch1-jetson \
            "Robot TMR main channel + OTA agent (Jetson)" \
            1.0.0 \
            individual_work/kutuzova_jetson_ota/sbom_jetson.json

      - name: Merge SBOMs
        run: ./scripts/merge_sbom.sh sbom_combined.json

      - name: Check licenses
        run: ./scripts/check_licenses.sh sbom_combined.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-analysis
          path: |
            dependencies_analysis.txt
            individual_work/*/sbom_*.json
            sbom_combined.json
          retention-days: 7

  sca-analysis:
    name: Trivy Vulnerability Scan
    needs: build-sbom
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:latest
      options: --entrypoint ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Jetson FS
        run: trivy fs --scanners vuln individual_work/kutuzova_jetson_ota | tee sca-jetson-report.txt

      - name: Scan STM32 FS
        run: trivy fs --scanners vuln individual_work/aitova_stm32_channel | tee sca-stm32-report.txt

      - name: Scan Jetson SBOM
        run: trivy sbom individual_work/kutuzova_jetson_ota/sbom_jetson.json | tee sca-sbom-report.txt

      - name: Critical Severity Scan
        run: trivy fs --scanners vuln --severity CRITICAL individual_work > sca-critical-report.txt || true

      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: sca-*-report.txt
          retention-days: 7

  security-gate:
    name: Security Gate Check
    needs: sca-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Download scan reports
        uses: actions/download-artifact@v4
        with:
          name: trivy-reports

      - name: Check for critical vulnerabilities
        run: |
          echo "=== Security Gate Check ==="
          critical_count=$(grep -c "CRITICAL" sca-critical-report.txt || true)
          if [ "$critical_count" -gt 0 ]; then
            echo "❌ КРИТИЧЕСКИЕ уязвимости обнаружены: $critical_count"
            exit 1
          fi
          echo "✅ Security Gate пройден"

  upload-to-dtrack:
    name: Upload to Dependency-Track
    needs: build-sbom
    runs-on: ubuntu-latest
    # Запускается только при ручном триггере или если явно разрешено
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[upload-dtrack]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl bash

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom-and-analysis

      - name: Set API Key
        run: echo "DTRACK_API_KEY=${{ secrets.DTRACK_API_KEY }}" >> $GITHUB_ENV

      - name: Upload to Dependency-Track
        run: ./scripts/upload_to_dtrack.sh